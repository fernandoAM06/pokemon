<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Pokémon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="pokemon-card">
        <img class="pokemon-image" src="images/snorlax.png" alt="Imatge del Pokémon">
        
        <div class="pokemon-info">
            <h2 class="pokemon-name">Snorlax</h2>

            <p class="pokemon-type normal">Normal</p>

            <p class="pokemon-description">
                Snorlax és un Pokémon de tipus Normal conegut per dormir gairebé tot el dia. Té una gran força i només es desperta per menjar.
            </p>
        </div>
    </div>
</body>
</html>
